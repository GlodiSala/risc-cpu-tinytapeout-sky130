<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <title>tt_um_cpu block diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- External SPI RAM -->
  <rect x="330" y="20" width="240" height="60" rx="8" fill="#eef3ff" stroke="#3355aa" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">External SPI RAM</text>
  <text x="450" y="65" text-anchor="middle" font-size="12" fill="#444444">ProgramMemory_SPI</text>

  <line x1="450" y1="80" x2="450" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="102" font-size="11" fill="#555555">instruction</text>

  <!-- ProgramCounter -->
  <rect x="330" y="118" width="240" height="55" rx="8" fill="#eef3ff" stroke="#3355aa" stroke-width="2"/>
  <text x="450" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ProgramCounter</text>

  <line x1="450" y1="173" x2="450" y2="208" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="195" font-size="11" fill="#555555">PC / instruction</text>

  <!-- ControlUnit -->
  <rect x="300" y="211" width="300" height="60" rx="8" fill="#fff3e0" stroke="#b36b00" stroke-width="2"/>
  <text x="450" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ControlUnit</text>
  <text x="450" y="256" text-anchor="middle" font-size="12" fill="#444444">opcode → control signals</text>

  <!-- fan-out lines to RegisterFile / ALU / FlagRegister -->
  <line x1="450" y1="271" x2="450" y2="295" stroke="#333333" stroke-width="2"/>
  <line x1="180" y1="295" x2="720" y2="295" stroke="#333333" stroke-width="2"/>
  <line x1="180" y1="295" x2="180" y2="318" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="295" x2="450" y2="318" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="295" x2="720" y2="318" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RegisterFile -->
  <rect x="60" y="321" width="240" height="60" rx="8" fill="#eaf7ea" stroke="#2f8f2f" stroke-width="2"/>
  <text x="180" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">RegisterFile</text>
  <text x="180" y="365" text-anchor="middle" font-size="11" fill="#444444">R0–R7</text>

  <!-- ALU -->
  <rect x="330" y="321" width="240" height="60" rx="8" fill="#eaf7ea" stroke="#2f8f2f" stroke-width="2"/>
  <text x="450" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">ALU</text>
  <text x="450" y="365" text-anchor="middle" font-size="11" fill="#444444">ADD / SUB / AND / OR / XOR / SHL / SHR / CMP</text>

  <!-- FlagRegister -->
  <rect x="600" y="321" width="240" height="60" rx="8" fill="#eaf7ea" stroke="#2f8f2f" stroke-width="2"/>
  <text x="720" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">FlagRegister</text>
  <text x="720" y="365" text-anchor="middle" font-size="11" fill="#444444">Z / S / C / O</text>

  <!-- converge to BranchUnit / DataMemory -->
  <line x1="180" y1="381" x2="180" y2="410" stroke="#333333" stroke-width="2"/>
  <line x1="450" y1="381" x2="450" y2="410" stroke="#333333" stroke-width="2"/>
  <line x1="720" y1="381" x2="720" y2="410" stroke="#333333" stroke-width="2"/>
  <line x1="180" y1="410" x2="330" y2="410" stroke="#333333" stroke-width="2"/>
  <line x1="720" y1="410" x2="570" y2="410" stroke="#333333" stroke-width="2"/>
  <line x1="330" y1="410" x2="330" y2="428" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="410" x2="570" y2="428" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BranchUnit -->
  <rect x="150" y="431" width="240" height="60" rx="8" fill="#f5e9fb" stroke="#7a3fa0" stroke-width="2"/>
  <text x="270" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">BranchUnit</text>
  <text x="270" y="475" text-anchor="middle" font-size="11" fill="#444444">JMP / BRZ / BRNZ / BRNS → next PC</text>

  <!-- DataMemory -->
  <rect x="450" y="431" width="240" height="60" rx="8" fill="#f5e9fb" stroke="#7a3fa0" stroke-width="2"/>
  <text x="570" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">DataMemory</text>
  <text x="570" y="475" text-anchor="middle" font-size="11" fill="#444444">32 × 8-bit RAM (LOAD / STORE)</text>

  <!-- BranchUnit feeds back to PC -->
  <path d="M 150,461 C 40,461 40,146 328,146" fill="none" stroke="#7a3fa0" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="45" y="300" font-size="11" fill="#7a3fa0">next_pc (feedback)</text>

  <!-- Chip I/O -->
  <rect x="330" y="530" width="240" height="55" rx="8" fill="#fdeaea" stroke="#b3261e" stroke-width="2"/>
  <text x="450" y="558" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">tt_um_cpu I/O</text>
  <text x="450" y="576" text-anchor="middle" font-size="11" fill="#444444">uo_out = PC[7:0], uio = SPI pins</text>

  <line x1="270" y1="491" x2="270" y2="557" stroke="#333333" stroke-width="2"/>
  <line x1="270" y1="557" x2="328" y2="557" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="491" x2="570" y2="528" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
